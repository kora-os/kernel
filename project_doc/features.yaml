      - id: console-fonts
        name: Console fonts
        status: completed
        description: Loadable fonts and Unicode text through a glyph provider, beyond the built-in 8x8 font.
        completed: 2026-11-24
        prs: [114, 115]
      - id: console-graphics
        name: Console graphics layer
        status: planned
        description: Pixels and redefinable glyphs composited under the text of a console.
      - id: gui
        name: Graphical desktop
        status: wish
        description: An optional GUI that runs as an application and hosts consoles in its windows.

