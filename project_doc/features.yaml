        prs: [10]
      - id: file-commands
        name: File management commands
        status: completed
        description: cp, rm, mkdir, rmdir, mv and sync on writable volumes.
        milestone: 9
        completed: 2026-10-05
        prs: [55]
      - id: volume-navigation
        name: Volume navigation
        status: completed
        description: Amiga-style device and volume names, assigns, cd and pwd.
        milestone: 8
        completed: 2026-10-04
        prs: [47, 49]
      - id: redirection
        name: Redirection
        status: in_progress
        description: Programs read stdin from a file and write stdout to one, with <, > and >>.
        prs: [102]
      - id: job-control
        name: Background jobs and pinning
        status: completed
        description: Run programs in the background or on a chosen core.
        milestone: 7
        completed: 2026-10-19
        prs: [52, 60]
      - id: multicore-demos
        name: Multicore demos
        status: completed
        description: A Mandelbrot rendered as one job per core, and hand-pinned unbalanced sub-processes.
        milestone: 7
        completed: 2026-10-20
        prs: [62]
      - id: line-editing
        name: Console line editing
        status: completed
        description: Line editing, history and a raw/cooked switch provided by the console to every program.
        completed: 2026-11-23
        prs: [106, 108]
      - id: break-key
        name: Ctrl+C break
        status: completed
        description: Ctrl+C stops the program in the foreground of a console.
        completed: 2026-11-23
        prs: [106, 108]

  # KoraCLI: project_doc/koracli-spec.md (what it is), koracli-plan.md (the
  # steps), docs/koracli.md (the user reference).
  - id: koracli
    name: KoraCLI
    description: The shell the machine starts in, like switching on a home computer, with Python, two BASIC dialects and OS commands at one prompt.
    features:
      - id: koracli
        name: KoraCLI shell
        status: completed
        description: The fullscreen shell on its own screen, with a top bar, a mode indicator and function-key labels; it replaces the shell.
        prs: [124, 126, 129]
        completed: 2026-11-25
      - id: python
        name: MicroPython
        status: completed
        description: MicroPython ported to KoraOS, KoraCLI's main language, with a kora module over the OS API.
        prs: [121, 122]
        completed: 2026-11-25
      - id: koracli-console
        name: KoraCLI console
        status: completed
        description: The console task behind KoraCLI, with bars outside the text grid and keys delivered as events.
        prs: [123]
        completed: 2026-11-25
      - id: koracli-python-mode
        name: Python mode
        status: completed
        description: A Python prompt with multi-line blocks, block history and one-character prefixes for BASIC lines and OS commands.
        prs: [124]
        completed: 2026-11-25
      - id: koracli-os-commands
        name: OS commands from Python
        status: completed
        description: Run or capture programs with !cmd and kora.run, and add commands as Python wrappers.
        prs: [125, 126]
        completed: 2026-11-25
      - id: koracli-os-mode
        name: OS mode
        status: completed
        description: A plain command shell with redirection, background jobs and core pinning, everything the shell before it had.
        prs: [126]
        completed: 2026-11-25
      - id: basic
        name: Classic BASIC
        status: completed
        description: A line-numbered BASIC in the tradition of the Commodore 64, MSX and GW-BASIC.
        prs: [127, 130]
        completed: 2026-11-26
      - id: bbc-basic
        name: BBC BASIC
        status: in_progress
        description: A second dialect modelled on BBC BASIC V, with PROC, FN, multi-line IF and star commands.
        prs: [131, 132, 133]
      - id: koracli-shared-variables
        name: Shared variables
        status: completed
        completed: 2026-11-26
        description: Python and BASIC see the same variables, with BASIC's type suffixes mapped to Python types.
        prs: [128]
      - id: koracli-machine-access
        name: Machine access
        status: planned
        description: PEEK, POKE, indirection operators, SYS and a GPIO layer, from BASIC and from Python.
      - id: koracli-graphics
        name: Graphics and sound
        status: planned
        description: One graphics and sound library for both languages, drawing on a screen of its own.
      - id: koracli-screen-editor
        name: Full-screen editor
        status: planned
        description: A C64-style editor where Enter on any line on the screen enters it again.
      - id: koracli-help
        name: Help
        status: planned
        description: HELP in BASIC, help() and ? in Python, from one source, and later F1 context help.
      - id: koracli-startup
        name: Startup file and configuration
        status: planned
        description: A Python startup file and settings for dialect, mode, editor style and function keys.
      - id: koracli-jobs
        name: Job objects
        status: planned
        description: Background jobs as Python objects, with jobs and fg.
      - id: basic-transpiler
        name: BASIC transpiler
        status: planned
        description: A BASIC program compiled to Python on its first run and cached, for speed.
      - id: koracli-graphics-layer
        name: Graphics over the console
        status: wish
        description: Graphics composited over KoraCLI's text with transparency, possibly on the GPU.
      - id: other-basics
        name: Other BASICs
        status: wish
        description: BASICs without line numbers, such as QBasic or AmigaBASIC, as applications of their own.

