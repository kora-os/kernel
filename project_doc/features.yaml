# KoraOS feature status.
#
# Machine-readable list of what KoraOS supports and what is coming, consumed by
# the project website. Validated in CI by tests/check-features.py; update it in
# the same PR that changes a feature's status.
#
# Layout: categories -> features. Category and feature ids are lowercase
# kebab-case and unique (feature ids across the whole file).
#
# Feature fields:
#   id           required  stable identifier, never reused
#   name         required  short display name
#   status       required  wish | planned | in_progress | completed
#                            wish         an idea, not scheduled
#                            planned      scheduled in project_doc/roadmap.md
#                            in_progress  being implemented
#                            completed    merged to main
#   description  optional  one sentence for the website
#   milestone    optional  roadmap milestone number (project_doc/roadmap.md)
#   platforms    optional  subset of: rpi3, rpi4, qemu-raspi3b, qemu-virt;
#                          omitted means the feature is platform independent
#   prs          optional  pull request numbers in `repository`
#   completed    required for completed features: date merged (YYYY-MM-DD)
#   version      optional, completed features only: first release containing it

schema: 1
repository: https://github.com/kora-os/kernel

categories:
  - id: platforms
    name: Platforms
    features:
      - id: rpi3
        name: Raspberry Pi 3
        status: completed
        description: Boots on real Raspberry Pi 3 hardware from the SD card.
        platforms: [rpi3]
        completed: 2026-09-18
        prs: [19, 20]
      - id: rpi4
        name: Raspberry Pi 4
        status: completed
        description: Boots on real Raspberry Pi 4 hardware from the SD card.
        platforms: [rpi4]
        completed: 2026-09-18
        prs: [19, 21]
      - id: qemu-raspi3b
        name: QEMU raspi3b
        status: completed
        description: Runs in QEMU's Raspberry Pi 3 emulation for quick testing.
        platforms: [qemu-raspi3b]
        completed: 2025-11-02
      - id: qemu-virt
        name: QEMU virt
        status: completed
        description: Independent AArch64 development target with VirtIO devices.
        platforms: [qemu-virt]
        completed: 2026-09-30
        prs: [38, 39, 40, 41, 42]

  - id: kernel
    name: Kernel core
    features:
      - id: boot-el1
        name: Boot and EL1 kernel
        status: completed
        description: Drops from EL2/EL3 to EL1 and parks secondary cores.
        completed: 2026-06-10
      - id: exceptions
        name: Exception vectors
        status: completed
        description: EL1 vector table with trap handling for kernel and EL0.
        completed: 2026-06-10
      - id: interrupts
        name: Interrupt controllers
        status: completed
        description: BCM controller on Pi 3, GIC-400 on Pi 4, GICv2 on virt.
        completed: 2026-09-30
        prs: [15, 32, 38]
      - id: system-timer
        name: System timer
        status: completed
        description: Generic-timer delays and a periodic interrupt tick.
        completed: 2026-09-17
        prs: [14, 15]
      - id: mmu
        name: MMU with flat identity map
        status: completed
        description: One shared address space with no memory protection, by design.
        completed: 2026-06-10
      - id: frame-allocator
        name: Page frame allocator
        status: completed
        description: Freeable bitmap allocator for physical pages.
        completed: 2026-07-23
        prs: [1]
      - id: kernel-heap
        name: Kernel heap
        status: completed
        description: Small-object kmalloc for the kernel and the USB stack.
        milestone: 6
        completed: 2026-10-03
        prs: [45]
      - id: cxx-runtime
        name: Freestanding C++ runtime
        status: completed
        description: Lets the kernel host C++ code such as the Circle USB stack.
        completed: 2026-09-17
        prs: [13]

  - id: multitasking
    name: Multitasking
    features:
      - id: cooperative-processes
        name: Cooperative processes
        status: completed
        description: Nested spawn/wait process model with per-task file tables.
        completed: 2026-08-12
        prs: [4]
      - id: preemptive-scheduler
        name: Preemptive scheduler
        status: in_progress
        description: Timer-driven task switching with sleeping and wait queues.
        milestone: 7
      - id: smp
        name: Multicore (SMP)
        status: planned
        description: User programs run in parallel on all cores under one big kernel lock.
        milestone: 7
      - id: core-pinning
        name: Core placement and pinning
        status: planned
        description: Per-core run queues; tasks can be started on a chosen core.
        milestone: 7
      - id: threads
        name: Threads and jobs
        status: planned
        description: Threads sharing a process, plus a job API to queue work to a core.
        milestone: 7

  - id: userland
    name: Userland
    features:
      - id: el0-programs
        name: User programs in EL0
        status: completed
        description: Position-independent ELF64 programs loaded and run in EL0.
        completed: 2026-07-24
        prs: [2, 3]
      - id: syscalls
        name: System calls
        status: completed
        description: I/O, memory, process and file syscalls with a private ABI.
        completed: 2026-09-16
        prs: [5, 10]
      - id: load-from-disk
        name: Programs loaded from disk
        status: completed
        description: The kernel boots /bin/init and programs load from the filesystem.
        completed: 2026-09-16
        prs: [11]
      - id: user-memory
        name: Growable user memory
        status: completed
        description: Page allocation syscalls and a pool-based malloc in libk.
        milestone: 6
        completed: 2026-10-04
        prs: [48]
      - id: libc
        name: C library
        status: planned
