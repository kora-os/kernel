        status: in_progress
        description: A small native ISO C library on the KoraOS syscalls, the base for koracli and MicroPython.
        milestone: 12
        prs: [76, 77, 78, 79, 80, 81, 82, 83, 84, 85, 86, 95, 96, 97, 98, 116, 119, 120]
      - id: userland-on-libc
        name: User programs on the C library
        status: completed
        description: The shell, the tools and the demos use stdio and the ISO C functions; libk keeps the KoraOS API only.
        milestone: 12
        completed: 2026-11-15
        prs: [88, 89, 90, 91, 92, 93]
      - id: console-handles
        name: Console handles
        status: completed
        description: A program's stdin and stdout are handles to a console instead of fixed file descriptors.
        completed: 2026-11-23
        prs: [102, 108]

  - id: shell
    name: Shell
    features:
