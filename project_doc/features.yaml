      - id: usb-mass-storage
        name: USB mass storage
        status: completed
        description: USB sticks and drives as volumes.
        platforms: [rpi3, rpi4, qemu-raspi3b]
        milestone: 10
        completed: 2026-10-27
        prs: [67]

