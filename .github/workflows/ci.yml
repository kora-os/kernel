# SPDX-License-Identifier: GPL-3.0-or-later
#
# Continuous integration: host tests, retained Pi builds/raspi3b smoke,
# and independent virt development profiles, on every pull request and every push to main.
# Real-hardware behaviour (USB, HDMI, caches, Pi 4 boot) is still tested by
# hand; see tests/README.md.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    name: Host unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # Ubuntu 24.04 runners randomise mmap addresses with more bits than
      # AddressSanitizer's shadow layout tolerates, which crashes ASan binaries
      # at startup. 28 bits is the long-standing default.
      - name: Make AddressSanitizer usable on this kernel
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Run host unit tests (clang, ASan + UBSan)
        run: tests/run-host-tests.sh

  build-and-smoke:
    name: Build kernels + QEMU smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang lld llvm cmake mtools qemu-system-arm

      - name: Build default raspi3b and Pi 4 targets together
        run: ./build.sh

      - name: Build all three target families together
        run: |
          cmake -S . -B build -DBUILD_VIRT_VARIANT=ON
          cmake --build build -j2

      - name: Build Raspberry Pi 3 kernel
        run: RPI_VERSION=3 ./build.sh --hw --release --build-dir build-rpi3

      - name: Build Raspberry Pi 4 kernel
        run: RPI_VERSION=4 ./build.sh --hw --release --build-dir build-rpi4

      - name: QEMU smoke test
        run: tests/run-qemu-smoke.py

      # One boot partition for both boards: firmware, device trees, config.txt,
      # kernel8-rpi3.img and kernel8-rpi4.img. Copy its contents to the SD card.
      - name: Assemble SD card boot files
        run: |
          mkdir -p sdcard-boot
          cp -R build-rpi3/boot/. sdcard-boot/
          cp -R build-rpi4/boot/. sdcard-boot/
          cp firmware/LICENCE.broadcom sdcard-boot/  # redistributed firmware's licence
          ls -l sdcard-boot

      - name: Upload SD card boot files
        uses: actions/upload-artifact@v7
        with:
          name: sdcard-boot
          path: sdcard-boot/
          if-no-files-found: error

      - name: Upload QEMU smoke artifacts (serial log, screenshots)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qemu-smoke
          path: build/qemu-smoke/
          if-no-files-found: ignore

  virt-tests:
    name: QEMU virt (${{ matrix.profile }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: embedded-graphics
            args: --repeat 64
          - profile: disk-keyboard
            args: --ram 128M --disk build-virt/fs/koraos.img --keyboard --repeat 256
          - profile: serial-small-ram
            args: --ram 64M --no-graphics --repeat 32
          - profile: el2-entry
            args: --el2 --no-graphics --repeat 32
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld llvm cmake mtools qemu-system-arm
      - name: Build virt kernel and rootfs
        run: ./build.sh --virt --build-dir build-virt
      - name: Exercise development profile
        run: tests/run-qemu-smoke.py --machine virt --kernel build-virt/kernel-virt.img --out build-virt/qemu-${{ matrix.profile }} ${{ matrix.args }}
      - name: Reject invalid configured root disk
        if: matrix.profile == 'disk-keyboard'
        run: |
          truncate -s 2M build-virt/invalid.img
          tests/run-qemu-smoke.py --machine virt --kernel build-virt/kernel-virt.img --disk build-virt/invalid.img --expect-root-failure --no-graphics --out build-virt/qemu-invalid-disk
      - name: Upload virt serial logs and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: virt-${{ matrix.profile }}
          path: build-virt/qemu-*/
          if-no-files-found: ignore
